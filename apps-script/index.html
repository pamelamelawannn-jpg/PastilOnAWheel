<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pastil Tracker</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');

      :root {
        --ink: #2c171a;
        --muted: #75686a;
        --cream: #f7f1e9;
        --card: #fffdf9;
        --line: #e6dcd2;
        --chili: #a82338;
        --chili-dark: #7e2530;
        --saffron: #f0ce84;
        --teal: #36796c;
        --danger: #b42318;
        --shadow: 0 14px 32px rgba(83, 45, 30, .09);
        --display: Fraunces, Georgia, serif;
        --sans: "DM Sans", Arial, sans-serif;
        --mono: "Space Mono", monospace;
      }

      * { box-sizing: border-box; }
      html { background: var(--cream); }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(240, 206, 132, .18), transparent 28rem),
          var(--cream);
        color: var(--ink);
        font: 15px/1.45 var(--sans);
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: wait; opacity: .6; }
      .app { min-height: 100vh; padding-bottom: 94px; }
      .topbar, main { width: min(100% - 32px, 1080px); margin: 0 auto; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 0 12px;
      }
      .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
      .brand-mark {
        display: grid; place-items: center; width: 42px; height: 42px; padding: 2px;
        overflow: hidden; border: 2px solid var(--chili); border-radius: 50%;
        background: var(--card); box-shadow: 4px 4px 0 var(--saffron);
      }
      .brand-mark img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
      .brand-name { display: block; font: 700 20px/1 var(--display); }
      .brand-caption { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      .sheet-status { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font-size: 11px; font-weight: 700; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
      h1, h2, h3, p { margin: 0; }
      h1 { font: 700 clamp(36px, 8vw, 64px)/.98 var(--display); letter-spacing: -.04em; }
      h2 { font: 700 28px/1.05 var(--display); letter-spacing: -.03em; }
      h3 { font: 700 18px/1.1 var(--display); }
      .eyebrow { margin-bottom: 8px; color: var(--chili); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      .muted { color: var(--muted); }
      .mono { font-family: var(--mono); }
      .hero { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin: 28px 0 30px; }
      .hero h1 span { color: var(--chili); }
      .hero-copy { max-width: 520px; }
      .hero-action { flex: 0 0 auto; }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 44px; padding: 0 17px; border: 0; border-radius: 999px;
        color: #fff; background: var(--chili); font-weight: 700; box-shadow: 4px 4px 0 var(--saffron);
        transition: transform .15s ease, filter .15s ease;
      }
      .button:hover { transform: translateY(-2px); filter: brightness(1.04); }
      .button.secondary { color: var(--ink); background: var(--saffron); box-shadow: none; }
      .button.ghost { color: var(--ink); background: var(--card); border: 1px solid var(--line); box-shadow: none; }
      .button.danger { background: var(--danger); box-shadow: none; }
      .button.small { min-height: 38px; padding: 0 13px; font-size: 13px; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .stat, .panel, .expense-row, .sale-row { border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
      .stat { min-height: 154px; padding: 19px; }
      .stat.red { color: #fff; background: var(--chili); border-color: var(--chili); }
      .stat.yellow { background: var(--saffron); border-color: #e5c376; }
      .stat.green { color: #fff; background: var(--teal); border-color: var(--teal); }
      .stat-label { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .78; }
      .stat-value { margin-top: 40px; font: 700 26px/1 var(--mono); }
      .stat-detail { margin-top: 8px; font-size: 12px; opacity: .72; }
      .two-col { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; margin-top: 28px; }
      .panel { padding: 22px; }
      .panel-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      .panel-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
      .text-link { border: 0; padding: 0; color: var(--chili); background: transparent; font-size: 12px; font-weight: 700; }
      .product-pulse, .activity-list { display: grid; gap: 9px; }
      .pulse-row, .activity-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 17px; background: #f1ebe4; }
      .pulse-content, .activity-content { min-width: 0; flex: 1; }
      .pulse-title, .activity-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pulse-sub, .activity-sub { color: var(--muted); font-size: 11px; }
      .pulse-count { color: var(--chili); font: 700 18px var(--mono); }
      .pulse-count small { margin-left: 4px; color: var(--muted); font: 700 10px var(--sans); }
      .activity-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: var(--chili); background: rgba(240, 206, 132, .5); }
      .activity-amount { font: 700 13px var(--mono); }
      .activity-amount.expense { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 28px 0 22px; }
      .page-head .actions { display: flex; gap: 8px; }
      .filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
      .filter {
        flex: 0 0 auto; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px;
        color: var(--muted); background: var(--card); font-size: 12px; font-weight: 700;
      }
      .filter.active { color: #fff; background: var(--chili); border-color: var(--chili); }
      .sale-list, .expense-list { display: grid; gap: 9px; }
      .sale-row, .expense-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; box-shadow: none; }
      .row-icon { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 14px; color: var(--chili); background: rgba(240, 206, 132, .45); }
      .row-content { min-width: 0; flex: 1; }
      .row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; text-transform: capitalize; }
      .row-sub { color: var(--muted); font-size: 11px; }
      .row-amount { color: var(--teal); font: 700 13px var(--mono); }
      .row-amount.expense { color: var(--chili); }
      .delete-button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; }
      .delete-button:hover { color: var(--danger); background: #fff0ee; }
      .clicker-intro { max-width: 570px; margin: 28px 0 24px; }
      .clicker-intro p { margin-top: 8px; color: var(--muted); }
      .clicker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .clicker-card { position: relative; min-height: 290px; overflow: hidden; padding: 0; border: 1px solid var(--line); border-radius: 26px; text-align: left; color: #fff; background: #391c20; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease; }
      .clicker-card:hover { transform: translateY(-3px); box-shadow: 0 20px 35px rgba(83, 45, 30, .18); }
      .clicker-card:active { transform: scale(.98); }
      .clicker-card.flash { outline: 4px solid var(--saffron); }
      .clicker-card .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(35, 19, 22, .94), rgba(35, 19, 22, .1) 70%); }
      .clicker-card .card-copy { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: end; height: 100%; padding: 20px; }
      .clicker-card .tag { align-self: start; margin-bottom: auto; padding: 5px 9px; border-radius: 999px; color: var(--ink); background: rgba(255, 253, 249, .9); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .clicker-card .product-name { font: 700 27px/1 var(--display); }
      .clicker-card .product-price { margin-top: 6px; color: var(--saffron); font: 700 18px var(--mono); }
      .product-illustration { position: absolute; inset: 0; width: 100%; height: 100%; }
      .product-illustration .background { fill: #dfb66f; }
      .product-illustration .background.jar { fill: #c6d3cc; }
      .product-illustration .bowl { fill: #693f2e; }
      .product-illustration .rice { fill: #fff8df; }
      .product-illustration .sauce { fill: #9b3f25; }
      .product-illustration .jar-body { fill: #8d4c26; }
      .product-illustration .jar-glass { fill: rgba(255, 237, 193, .34); stroke: rgba(255, 255, 255, .45); stroke-width: 2; }
      .product-illustration .lid { fill: #d4a632; }
      .product-illustration .label { fill: #fffaf0; }
      .empty { padding: 46px 18px; border: 1px dashed var(--line); border-radius: 20px; text-align: center; background: rgba(255,255,255,.32); }
      .empty-icon { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 15px; color: var(--chili); background: rgba(240, 206, 132, .55); }
      .empty p { max-width: 290px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
      .expense-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
      .mini-stat { padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--saffron); }
      .mini-stat:nth-child(2) { background: var(--card); }
      .mini-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .mini-value { margin-top: 8px; font: 700 22px var(--mono); }
      .settings-stack { display: grid; gap: 18px; max-width: 760px; }
      .settings-card { padding: 21px; border: 1px solid var(--line); border-radius: 23px; background: var(--card); box-shadow: var(--shadow); }
      .settings-card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
      .settings-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; color: var(--chili); background: rgba(240, 206, 132, .55); }
      .settings-card-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
      .field-label { display: block; margin-bottom: 14px; color: var(--muted); font-size: 12px; font-weight: 700; }
      .field, .price-input { width: 100%; min-height: 44px; margin-top: 7px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; outline: 0; color: var(--ink); background: #fffdf9; }
      .field:focus, .price-input:focus { border-color: var(--chili); box-shadow: 0 0 0 3px rgba(168, 35, 56, .12); }
      .product-settings { display: grid; gap: 9px; }
      .product-setting { display: flex; align-items: center; gap: 12px; padding: 11px; border-radius: 16px; background: #f1ebe4; }
      .setting-art { display: grid; place-items: center; width: 42px; height: 42px; overflow: hidden; border-radius: 12px; background: #e7c37a; }
      .setting-art svg { width: 58px; height: 58px; }
      .price-wrap { display: flex; align-items: center; width: 112px; padding-left: 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); }
      .price-wrap span { color: var(--muted); font: 700 12px var(--mono); }
      .price-input { width: 80px; margin: 0; padding: 0 8px; border: 0; text-align: right; font: 700 13px var(--mono); background: transparent; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; padding: 12px; background: rgba(44, 23, 26, .38); }
      .modal { width: min(100%, 480px); padding: 22px; border-radius: 26px; background: var(--card); box-shadow: 0 24px 60px rgba(44, 23, 26, .24); animation: rise .18s ease-out; }
      .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .close { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; color: var(--muted); background: transparent; }
      .close:hover { background: #f1ebe4; }
      .form-actions { display: flex; gap: 9px; margin-top: 20px; }
      .form-actions .button { flex: 1; box-shadow: none; }
      .toast { position: fixed; left: 50%; bottom: 106px; z-index: 30; transform: translateX(-50%); padding: 12px 16px; border-radius: 999px; color: #fff; background: var(--ink); box-shadow: 0 12px 30px rgba(44, 23, 26, .22); font-size: 12px; font-weight: 700; white-space: nowrap; animation: rise .2s ease-out; }
      .loading { min-height: 55vh; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
      .bottom-nav { position: fixed; right: 0; bottom: 0; left: 0; z-index: 10; padding: 8px 8px max(9px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(230, 220, 210, .9); background: rgba(247, 241, 233, .94); backdrop-filter: blur(14px); }
      .nav-inner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: min(100%, 560px); margin: 0 auto; }
      .nav-button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; border: 0; border-radius: 16px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 700; }
      .nav-button.active { color: #fff; background: var(--chili); box-shadow: 0 7px 18px rgba(126, 37, 47, .2); }
      .nav-button svg { width: 20px; height: 20px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 760px) {
        .topbar, main { width: min(100% - 24px, 620px); }
        .topbar { padding-top: 17px; }
        .brand-name { font-size: 18px; }
        .hero { display: block; margin-top: 23px; }
        .hero-action { margin-top: 18px; }
        .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat { min-height: 138px; padding: 15px; }
        .stat-value { margin-top: 30px; font-size: 21px; }
        .two-col { grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
        .panel { padding: 17px; }
        .clicker-grid { grid-template-columns: 1fr; gap: 12px; }
        .clicker-card { min-height: 190px; }
        .clicker-card .product-name { font-size: 25px; }
        .page-head { margin-top: 22px; }
        .page-head h2 { font-size: 32px; }
        .page-head .actions .button { padding: 0 12px; }
      }
      @media (max-width: 390px) {
        .sheet-status { padding: 7px 9px; font-size: 10px; }
        .brand-caption { font-size: 9px; }
        .brand-name { font-size: 16px; }
        .stat-label { font-size: 9px; }
        .stat-value { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="loading">Loading your sheet…</div>
    </div>

    <script>
      const state = {
        data: null,
        view: 'dashboard',
        salesFilter: 'all',
        toastTimer: null,
        flashProduct: null,
      };

      const $ = (selector) => document.querySelector(selector);
      const money = (amount) => `₱${Number(amount || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 })}`;
      const today = () => {
        const date = new Date();
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 10);
      };
      const dateLabel = (stamp) => new Date(stamp).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
      const timeLabel = (stamp) => new Date(stamp).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
      const isToday = (stamp) => String(stamp).slice(0, 10) === today();

      function icon(name, size = 20) {
        const paths = {
          home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
          click: '<circle cx="12" cy="12" r="8"/><path d="M12 8v8m-4-4h8"/>',
          sales: '<path d="M4 19V5m0 14h16"/><path d="m7 15 3-4 3 2 4-6"/>',
          expense: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
          settings: '<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="3"/>',
          bag: '<path d="M5 8h14l1 12H4Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2m-5 4h2"/>',
          receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
          trash: '<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',
          close: '<path d="m6 6 12 12M18 6 6 18"/>',
          check: '<path d="m5 12 4 4L19 6"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
          jar: '<path d="M7 6h10v13H7zM8 3h8v3H8z"/><path d="M9 10h6M9 13h6"/>',
          bowl: '<path d="M4 11h16c0 5-3.6 8-8 8s-8-3-8-8Z"/><path d="M6 11c1-3 3-5 6-5s5 2 6 5"/>',
          sheet: '<path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
        };
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.sheet}</svg>`;
      }

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
        }[char]));
      }

      function productArt(product, small = false) {
        const isRice = product.id === 'rice';
        return `<svg class="product-illustration" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="400" height="300" class="background${isRice ? '' : ' jar'}"/>
          ${isRice
            ? `<ellipse cx="200" cy="214" rx="134" ry="38" fill="#45291f"/>
               <path class="bowl" d="M76 164h248c-4 76-50 103-124 103S80 240 76 164Z"/>
               <ellipse class="rice" cx="200" cy="165" rx="112" ry="40"/>
               <path class="sauce" d="M119 166c24-24 51-22 74-4 23-22 50-25 84 3-31 8-42 31-77 14-28 19-49-7-81-13Z"/>
               <circle cx="154" cy="158" r="7" fill="#e3a945"/><circle cx="231" cy="151" r="8" fill="#c65c32"/><circle cx="275" cy="170" r="6" fill="#d4a52e"/>
               <path d="M139 213c18 11 34 12 54 10m28 0c20 2 40 0 59-10" stroke="#b46d45" stroke-width="5" stroke-linecap="round" opacity=".7"/>`
            : `<rect x="108" y="64" width="184" height="188" rx="26" class="jar-body"/>
               <rect x="108" y="64" width="184" height="188" rx="26" class="jar-glass"/>
               <rect x="122" y="49" width="156" height="33" rx="9" class="lid"/>
               <rect x="130" y="124" width="140" height="77" rx="5" class="label"/>
               <circle cx="200" cy="149" r="19" fill="#a82338"/><path d="M190 158c8-22 16-22 20 0m-10-12v19" stroke="#fff" stroke-width="3" fill="none"/>
               <path d="M163 180h74" stroke="#a82338" stroke-width="3" opacity=".7"/>
               <circle cx="145" cy="103" r="7" fill="#e2b23d"/><circle cx="245" cy="224" r="8" fill="#e2b23d"/><circle cx="267" cy="105" r="5" fill="#d96d2f"/>`}
        </svg>`;
      }

      function apiCall(name, args, onSuccess) {
        setBusy(true);
        google.script.run
          .withSuccessHandler((data) => {
            setBusy(false);
            if (data && data.products) state.data = data;
            if (onSuccess) onSuccess(data);
            render();
          })
          .withFailureHandler((error) => {
            setBusy(false);
            showToast(error && error.message ? error.message : 'Something went wrong.');
          })[name](...(args || []));
      }

      function setBusy(isBusy) {
        document.body.classList.toggle('is-busy', isBusy);
        document.querySelectorAll('button').forEach((button) => {
          if (button.dataset.keepEnabled !== 'true') button.disabled = isBusy;
        });
      }

      function showToast(message) {
        clearTimeout(state.toastTimer);
        let toast = $('.toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.className = 'toast';
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        state.toastTimer = setTimeout(() => toast.remove(), 2800);
      }

      function render() {
        if (!state.data) return;
        const root = $('#app');
        root.innerHTML = `

        if (state.view === 'clicker') return renderClicker();
        if (state.view === 'sales') return renderSales();
        if (state.view === 'expenses') return renderExpenses();
        if (state.view === 'settings') return renderSettings();
        return renderDashboard();
      }

      function renderDashboard() {
        const sales = state.data.sales.filter((sale) => isToday(sale.timestamp));
        const expenses = state.data.expenses.filter((expense) => isToday(expense.timestamp));
        const revenue = sales.reduce((sum, sale) => sum + Number(sale.unitPrice), 0);
        const spend = expenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
        const recent = [
          ...sales.map((sale) => ({ kind: 'sale', title: sale.productName, amount: sale.unitPrice, timestamp: sale.timestamp, sub: `${timeLabel(sale.timestamp)} · ${sale.source === 'clicker' ? 'Quick sale' : 'Manual entry'}` })),
          ...expenses.map((expense) => ({ kind: 'expense', title: expense.category, amount: expense.amount, timestamp: expense.timestamp, sub: `${timeLabel(expense.timestamp)} · Expense` })),
        ].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5);

        return `<section class="hero">
          <div class="hero-copy"><p class="eyebrow">${new Date().toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' })}</p><h1>Keep the wheel<br><span>turning.</span></h1></div>
          <div class="hero-action"><button class="button" data-action="nav" data-view="clicker">Record a sale ${icon('arrow', 16)}</button></div>
        </section>
        <section class="stats">
          ${statCard('Sales', money(revenue), `${sales.length} item${sales.length === 1 ? '' : 's'} today`, 'red', 'bag')}
          ${statCard('Expenses', money(spend), `${expenses.length} logged today`, 'yellow', 'receipt')}
          ${statCard('Profit', money(revenue - spend), 'Sales minus expenses', 'green', 'arrow')}
          ${statCard('Items', sales.length, 'Across 3 products', '', 'jar')}
        </section>
        <section class="two-col">
          <div class="panel"><div class="panel-head"><div><p>Product pulse</p><h2>What moved today</h2></div><button class="text-link" data-action="nav" data-view="clicker">Open clicker →</button></div>
            <div class="product-pulse">${state.data.products.map((product) => {
              const count = sales.filter((sale) => sale.productId === product.id).length;
              return `<div class="pulse-row"><div class="setting-art">${productArt(product, true)}</div><div class="pulse-content"><div class="pulse-title">${esc(product.name)}</div><div class="pulse-sub">${money(product.price)} each</div></div><div class="pulse-count">${count}<small>sold</small></div></div>`;
            }).join('')}</div>
          </div>
          <div class="panel"><div class="panel-head"><div><p>Live ledger</p><h2>Recent activity</h2></div><button class="text-link" data-action="nav" data-view="sales">View all →</button></div>
            ${recent.length ? `<div class="activity-list">${recent.map((item) => `<div class="activity-row"><div class="activity-icon">${icon(item.kind === 'sale' ? 'bag' : 'receipt', 17)}</div><div class="activity-content"><div class="activity-title">${esc(item.title)}</div><div class="activity-sub">${esc(item.sub)}</div></div><div class="activity-amount ${item.kind === 'expense' ? 'expense' : ''}">${item.kind === 'sale' ? '+' : '-'}${money(item.amount)}</div></div>`).join('')}</div>` : emptyState('receipt', 'Nothing logged yet', 'Your first click will show up here.', 'Open clicker', 'clicker')}
          </div>
        </section>`;
      }

      function statCard(label, value, detail, tone, iconName) {
        return `<div class="stat ${tone}"><div class="stat-label"><span>${label}</span>${icon(iconName, 20)}</div><div class="stat-value">${value}</div><div class="stat-detail">${detail}</div></div>`;
      }

      function renderClicker() {
        return `<section class="clicker-intro"><p class="eyebrow">One tap, done</p><h2>Sales clicker</h2><p>Tap what left the counter. Every tap saves to the Sales sheet immediately.</p></section>
          <section class="clicker-grid">${state.data.products.map((product) => `
            <button class="clicker-card ${state.flashProduct === product.id ? 'flash' : ''}" data-action="sale" data-product-id="${esc(product.id)}">
              ${productArt(product)}<span class="shade"></span><span class="card-copy"><span class="tag">${esc(product.shortLabel)}</span><span class="product-name">${esc(product.name)}</span><span class="product-price">${money(product.price)}</span></span>
            </button>`).join('')}</section>
          <div class="panel" style="margin-top:18px"><div class="panel-head"><div><p>Instant save</p><h3>No separate submit step</h3></div><button class="text-link" data-action="nav" data-view="sales">Review sales →</button></div><p class="muted" style="font-size:12px">Clicker entries are written directly to the Google Sheet and appear in the sales log.</p></div>`;
      }

      function renderSales() {
        const visible = state.data.sales.filter((sale) => state.salesFilter === 'all' || sale.source === state.salesFilter);
        return `<section class="page-head"><div><p class="eyebrow">The ledger</p><h2>Sales log</h2></div><div class="actions"><button class="button small" data-action="open-sale-modal">${icon('plus', 15)} Manual sale</button></div></section>
          <div class="filters">${['all', 'clicker', 'manual'].map((filter) => `<button class="filter ${state.salesFilter === filter ? 'active' : ''}" data-action="sales-filter" data-filter="${filter}">${filter === 'all' ? 'All entries' : filter}</button>`).join('')}</div>
          ${visible.length ? `<div class="sale-list">${visible.map((sale) => `<div class="sale-row"><div class="row-icon">${icon('bag', 18)}</div><div class="row-content"><div class="row-title">${esc(sale.productName)}</div><div class="row-sub">${dateLabel(sale.timestamp)} · ${timeLabel(sale.timestamp)} · ${esc(sale.source)}</div></div><div class="row-amount">+${money(sale.unitPrice)}</div><button class="delete-button" data-action="delete-sale" data-id="${esc(sale.id)}" aria-label="Delete sale">${icon('trash', 16)}</button></div>`).join('')}</div>` : emptyState('bag', 'Your log is clear', 'Sales recorded with the clicker will appear here.', 'Open clicker', 'clicker')}`;
      }

      function renderExpenses() {
        const total = state.data.expenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
        return `<section class="page-head"><div><p class="eyebrow">Keep it honest</p><h2>Expenses</h2></div><div class="actions"><button class="button small" data-action="open-expense-modal">${icon('plus', 15)} Add expense</button></div></section>
          <section class="expense-summary"><div class="mini-stat"><div class="mini-label">All-time spend</div><div class="mini-value">${money(total)}</div></div><div class="mini-stat"><div class="mini-label">Entries</div><div class="mini-value">${state.data.expenses.length}</div></div></section>
          ${state.data.expenses.length ? `<div class="expense-list">${state.data.expenses.map((expense) => `<div class="expense-row"><div class="row-icon">${icon('receipt', 18)}</div><div class="row-content"><div class="row-title">${esc(expense.category)}</div><div class="row-sub">${esc(expense.note || 'No note')} · ${dateLabel(expense.timestamp)}</div></div><div class="row-amount expense">-${money(expense.amount)}</div><button class="delete-button" data-action="delete-expense" data-id="${esc(expense.id)}" aria-label="Delete expense">${icon('trash', 16)}</button></div>`).join('')}</div>` : emptyState('receipt', 'No expenses yet', 'Log ingredients, rent, and the small things that keep the wheel moving.', 'Log an expense', 'open-expense-modal')}`;
      }

      function renderSettings() {
        return `<section class="page-head"><div><p class="eyebrow">Make it yours</p><h2>Settings</h2></div></section>
          <div class="settings-stack">
            <section class="settings-card"><div class="settings-card-head"><span class="settings-icon">${icon('settings', 18)}</span><div><h3>Counter details</h3><p>Saved directly in the Settings sheet.</p></div></div><label class="field-label">Business name<input id="business-name" class="field" value="${esc(state.data.settings.businessName)}"></label><button class="button" data-action="save-settings">Save details</button></section>
            <section class="settings-card"><div class="settings-card-head"><span class="settings-icon">${icon('jar', 18)}</span><div><h3>Products & prices</h3><p>The clicker uses these prices.</p></div></div><div class="product-settings">${state.data.products.map((product) => `<div class="product-setting"><div class="setting-art">${productArt(product, true)}</div><div class="row-content"><div class="row-title">${esc(product.name)}</div><div class="row-sub">Product button</div></div><div class="price-wrap"><span>₱</span><input class="price-input" data-price-id="${esc(product.id)}" type="number" min="1" step="1" value="${Number(product.price)}" aria-label="${esc(product.name)} price"></div></div>`).join('')}</div><button class="button" style="margin-top:16px" data-action="save-prices">Save prices</button></section>
            <section class="settings-card"><div class="settings-card-head"><span class="settings-icon">${icon('sheet', 18)}</span><div><h3>Google Sheets backend</h3><p>This app writes sales, expenses, products, and settings to the current spreadsheet. No backup or sync service is used.</p></div></div><p class="muted" style="font-size:12px">The first time the app loads, it creates four sheets: Sales, Expenses, Products, and Settings.</p></section>
          </div>`;
      }

      function emptyState(iconName, title, body, actionLabel, actionName) {
        return `<div class="empty"><div class="empty-icon">${icon(iconName, 20)}</div><h3>${title}</h3><p>${body}</p><button class="button small" style="margin-top:16px;box-shadow:none" data-action="${actionName === 'clicker' ? 'nav' : actionName}" ${actionName === 'clicker' ? 'data-view="clicker"' : ''}>${actionLabel}</button></div>`;
      }

      function openModal(html) {
        const existing = $('.modal-backdrop');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', `<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`);
      }

      function closeModal() {
        const modal = $('.modal-backdrop');
        if (modal) modal.remove();
      }

      function openSaleModal() {
        openModal(`<div class="modal-head"><h2>Add a manual sale</h2><button class="close" data-action="close-modal" aria-label="Close">${icon('close', 18)}</button></div>
          <form id="sale-form"><label class="field-label">Product<select id="sale-product" class="field" required>${state.data.products.map((product) => `<option value="${esc(product.id)}">${esc(product.name)} · ${money(product.price)}</option>`).join('')}</select></label><div class="form-actions"><button type="button" class="button ghost" data-action="close-modal">Cancel</button><button class="button" type="submit">Save sale</button></div></form>`);
      }

      function openExpenseModal() {
        openModal(`<div class="modal-head"><h2>Log an expense</h2><button class="close" data-action="close-modal" aria-label="Close">${icon('close', 18)}</button></div>
          <form id="expense-form"><label class="field-label">Category<select id="expense-category" class="field" required>${state.data.expenseCategories.map((item) => `<option value="${esc(item)}">${esc(item)}</option>`).join('')}</select></label><label class="field-label">Amount<input id="expense-amount" class="field" type="number" min="1" step=".01" placeholder="0.00" required></label><label class="field-label">Date<input id="expense-date" class="field" type="date" value="${today()}" required></label><label class="field-label">Note (optional)<input id="expense-note" class="field" placeholder="e.g. market run"></label><div class="form-actions"><button type="button" class="button ghost" data-action="close-modal">Cancel</button><button class="button" type="submit">Save expense</button></div></form>`);
      }

      function wireEvents() {
        document.querySelectorAll('[data-action]').forEach((element) => {
          element.addEventListener('click', (event) => {
            event.stopPropagation();
            const action = element.dataset.action;
            if (action === 'nav') { state.view = element.dataset.view; render(); window.scrollTo(0, 0); }
            if (action === 'open-sale-modal') openSaleModal();
            if (action === 'open-expense-modal') openExpenseModal();
            if (action === 'close-modal' && event.target === element) closeModal();
            if (action === 'sales-filter') { state.salesFilter = element.dataset.filter; render(); }
            if (action === 'sale') recordSale(element.dataset.productId, 'clicker');
            if (action === 'delete-sale') deleteSale(element.dataset.id);
            if (action === 'delete-expense') deleteExpense(element.dataset.id);
            if (action === 'save-settings') saveSettings();
            if (action === 'save-prices') savePrices();
          });
        });

        const saleForm = $('#sale-form');
        if (saleForm) saleForm.addEventListener('submit', (event) => {
          event.preventDefault();
          recordSale($('#sale-product').value, 'manual');
          closeModal();
        });

        const expenseForm = $('#expense-form');
        if (expenseForm) expenseForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const amount = Number($('#expense-amount').value);
          if (!amount || amount <= 0) return showToast('Enter an amount greater than zero.');
          apiCall('addExpense', [{
            category: $('#expense-category').value,
            amount,
            date: $('#expense-date').value,
            note: $('#expense-note').value,
          }], () => { closeModal(); showToast('Expense saved to Sheets'); });
        });
      }

      function recordSale(productId, source) {
        const product = state.data.products.find((item) => item.id === productId);
        if (!product) return;
        state.flashProduct = productId;
        render();
        apiCall('addSale', [{ productId, source, timestamp: new Date().toISOString() }], () => {
          showToast(`${product.name} saved to Sheets`);
          setTimeout(() => { state.flashProduct = null; render(); }, 350);
        });
      }

      function deleteSale(id) {
        const sale = state.data.sales.find((item) => item.id === id);
        if (!sale || !confirm(`Delete ${sale.productName}? This cannot be undone.`)) return;
        apiCall('deleteSale', [id], () => showToast('Sale deleted'));
      }

      function deleteExpense(id) {
        const expense = state.data.expenses.find((item) => item.id === id);
        if (!expense || !confirm(`Delete ${expense.category}? This cannot be undone.`)) return;
        apiCall('deleteExpense', [id], () => showToast('Expense deleted'));
      }

      function saveSettings() {
        const businessName = $('#business-name').value.trim() || 'Pastil on a Wheel';
        apiCall('updateSettings', [{ businessName }], () => showToast('Details saved to Sheets'));
      }

      function savePrices() {
        const inputs = [...document.querySelectorAll('[data-price-id]')];
        const changes = inputs
          .map((input) => ({ id: input.dataset.priceId, price: Number(input.value) }))
          .filter((change) => {
            const product = state.data.products.find((item) => item.id === change.id);
            return product && change.price !== Number(product.price);
          });
        if (!changes.length) return showToast('No price changes to save.');
        if (changes.some((change) => !change.price || change.price <= 0)) {
          return showToast('Enter valid prices.');
        }

        const saveNext = (index) => {
          if (index >= changes.length) return showToast('Prices saved to Sheets');
          const change = changes[index];
          apiCall('updateProduct', [change.id, change.price], () => saveNext(index + 1));
        };
        saveNext(0);
      }

      function boot() {
        apiCall('getAppData', [], () => render());
      }

      window.addEventListener('load', boot);
    </script>
  </body>
</html>
